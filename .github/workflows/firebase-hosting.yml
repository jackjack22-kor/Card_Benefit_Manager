name: Deploy Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-hosting-live
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: firebase-hosting
      url: https://cardfit-ee4b5.web.app
    env:
      FIREBASE_SERVICE_ACCOUNT_CARDFIT_EE4B5: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CARDFIT_EE4B5 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit
        run: npm run audit:check

      - name: Build for Firebase Hosting
        run: npm run build:hosting

      - name: Explain skipped deploy
        if: env.FIREBASE_SERVICE_ACCOUNT_CARDFIT_EE4B5 == ''
        run: echo "FIREBASE_SERVICE_ACCOUNT_CARDFIT_EE4B5 secret is not set. Build succeeded, deploy skipped."

      - name: Deploy to Firebase Hosting
        if: env.FIREBASE_SERVICE_ACCOUNT_CARDFIT_EE4B5 != ''
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CARDFIT_EE4B5 }}
          channelId: live
          projectId: cardfit-ee4b5
